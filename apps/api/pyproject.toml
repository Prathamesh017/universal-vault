[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prathamesh017", email = "prathamesh06pt@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "requests",
    "python-dotenv",
    "numpy",
    "google-genai>=2.25.0",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
api = "api.main:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
